[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -v
    --tb=short
    --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit:        Pure unit tests (no I/O)
    integration: Tests requiring running services
    slow:        Tests that take >5 seconds
